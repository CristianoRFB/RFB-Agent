name: Edge Firestore REST integration (emulator-only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'worker/**'
      - 'firebase/**'
      - 'package.json'
      - '.github/workflows/worker-emulator.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  firestore-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Validate REST transactions against actual Auth/Firestore Emulators
        run: npm exec -- firebase emulators:exec --project demo-rfbagent --config firebase/firebase.json --only auth,firestore "node --test worker/tests/emulator-rest.test.mjs"
