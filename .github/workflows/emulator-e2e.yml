name: Full emulator browser QA (synthetic)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install emulator/Playwright dependencies
        run: npm install --no-audit --no-fund
      - name: Install React workspace
        run: npm install --prefix web --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Seed isolated Auth/Firestore emulators and test
        run: npm exec -- firebase emulators:exec --project demo-rfbagent --config firebase/firebase.json --only auth,firestore "node firebase/seed.mjs && npx playwright test --config web/playwright.config.mjs"
      - name: Synthetic screenshots and trace
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rfbagent-emulator-browser
          path: |
            test-results/*.png
            test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 7
