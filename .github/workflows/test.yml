name: Unit tests (deterministic local domain)
on:
  push:
    branches: [feature/rfb-agent-g1-vertical-simulator]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: JavaScript syntax
        run: |
          node --check src/domain.mjs
          node --check src/app.js
