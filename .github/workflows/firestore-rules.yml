name: Firestore tenant security (emulator only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'firebase/**'
      - 'package.json'
      - '.github/workflows/firestore-rules.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install test tooling (no production credentials)
        run: npm install --no-audit --no-fund
      - name: Run isolated Firestore Security Rules tests
        run: npm run test:rules
