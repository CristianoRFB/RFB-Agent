name: Gateway transactions (Auth + Firestore Emulator)
on:
  pull_request:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'firebase/**'
      - 'package.json'
      - '.github/workflows/gateway.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
      - name: Verify token, tenant, confirmation, idempotence and audit
        run: npm run test:gateway
